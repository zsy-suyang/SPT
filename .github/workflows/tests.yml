name: Software checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.0,<2.8' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Check command-line entry point
        run: |
          spt --help
          spt list-models
      - name: Run lightweight tests
        run: python -m pytest -q
